apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: configuration
spec:
  type: configuration.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis:6379
  - name: redisPassword
    secretKeyRef:
      name: redis
      key: password
  - name: enableTLS
    value: false
auth:
  secretStore: secretstore
