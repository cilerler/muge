networks:
  muge_network:
    external: true

volumes:
  dapr_scheduler:

services:

  placement:
    container_name: placement
    image: "daprio/dapr:1.16.2"
    command: ["./placement", "-port", "50005"]
    networks:
      - "muge_network"
    restart: "unless-stopped"

  scheduler:
    container_name: scheduler
    image: "daprio/dapr:1.16.2"
    command: ["./scheduler",
              "--port", "50006",
              "--etcd-data-dir", "/var/lock/dapr/scheduler"
             ]
    volumes:
      - dapr_scheduler:/var/lock
    networks:
      - "muge_network"
    restart: "unless-stopped"

  linqpad-dapr:
    container_name: linqpad-dapr
    image: "daprio/daprd:1.16.2"
    ports:
      - "3500:3500"
      - "50001:50001"
    command: ["./daprd",
              "--placement-host-address", "placement:50005",
              "--scheduler-host-address", "scheduler:50006",
              "--resources-path", "/components",
              "--config", "/config/dapr-config.yaml",
              "--app-id", "linqpad",
              "--dapr-http-port", "3500",
              "--dapr-grpc-port", "50001",
              "--dapr-listen-addresses", "0.0.0.0",
              "--metrics-port", "9090",
              "--app-port", "5000",
              "--app-channel-address", "host.docker.internal",
              "--log-level", "info",
              "--enable-api-logging", "false"
             ]
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
        - ${APPDATA}/Microsoft/UserSecrets/LinqPad:/secrets:ro
        - ./config/components/development:/components
        - ./config/dapr-config.yaml:/config/dapr-config.yaml:ro
        - "${DAPR_LOCALSTORAGE_BINDMOUNT}:/localstorage"
    # network_mode: "service:linqpad"
    networks:
      - muge_network
    depends_on:
      placement:
        condition: service_started
      scheduler:
        condition: service_started
    restart: "unless-stopped"


